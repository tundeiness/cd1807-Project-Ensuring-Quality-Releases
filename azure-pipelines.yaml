name: Azure Pipelines

trigger:
  - main

pool:
  name: myAgentPool

variables:
  - group: azure-credentials
  - name: python.version
    value: '3.8.10'
  - name: azureServiceConnectionId
    value: 'myConnex'
  - name: projectRoot
    value: $(System.DefaultWorkingDirectory)
  - name: environmentName
    value: 'test'
  - name: webAppName
    value: 'Udacity-app-3bb41105'

stages:
  #--------------------------------------------#
  # BUILD STAGE
  #--------------------------------------------#
  - stage: Build
    displayName: Build Stage
    jobs:
      - job: BuildInfrastructure
        displayName: Terraform | Provision / Refresh Infra
        steps:
          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
            displayName: 'Terraform installation'
            inputs:
              terraformVersion: '1.2.9'

          - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
            displayName: 'Terraform init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
              backendServiceArm: '$(azureServiceConnectionId)'
              backendAzureRmResourceGroupName: 'Azuredevops'
              backendAzureRmStorageAccountName: 'tfstate182032827'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'test.terraform.tfstate'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - task: DownloadSecureFile@1
            name: sshKey
            displayName: 'Download SSH Private Key'
            inputs:
              secureFile: 'id_rsa'

          - task: DownloadSecureFile@1
            name: sshPubKey
            displayName: 'Download SSH Public Key'
            inputs:
              secureFile: 'id_rsa.pub'

          - task: InstallSSHKey@0
            displayName: 'Install SSH Key for VM Access'
            inputs:
              knownHostsEntry: '$(KNOWN_HOSTS_STRING)'
              sshPublicKey: '$(SSH_PUBLIC_KEY)'
              sshKeySecureFile: 'id_rsa'

          - script: |
              cd $(System.DefaultWorkingDirectory)/terraform/environments/test
              terraform validate
            displayName: 'Terraform validate'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              TF_VAR_ssh_public_key: $(cat $(sshPubKey.secureFilePath))

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              cd $(System.DefaultWorkingDirectory)/terraform/environments/test
              SSH_KEY=$(cat $(sshPubKey.secureFilePath))
              terraform plan -detailed-exitcode -var="ssh_public_key=$SSH_KEY"
              exit_code=$?
              if [ $exit_code -eq 1 ]; then
                echo "##[error]Terraform plan failed"
                exit 1
              fi
              echo "Terraform plan succeeded (exit code: $exit_code)"
              exit 0
            displayName: 'Terraform plan'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: |
              export ARM_CLIENT_ID=$(ARM_CLIENT_ID)
              export ARM_CLIENT_SECRET=$(ARM_CLIENT_SECRET)
              export ARM_TENANT_ID=$(ARM_TENANT_ID)
              export ARM_SUBSCRIPTION_ID=$(ARM_SUBSCRIPTION_ID)
              cd $(System.DefaultWorkingDirectory)/terraform/environments/test
              SSH_KEY=$(cat $(sshPubKey.secureFilePath))
              terraform apply -auto-approve -var="ssh_public_key=$SSH_KEY"
            displayName: 'Terraform apply'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

      - job: ArchiveArtifacts
        displayName: Archive | Publish Build Artifacts
        dependsOn: BuildInfrastructure
        steps:
          #--------------------------------------------#
          # Archive Terraform files
          #--------------------------------------------#
          - task: ArchiveFiles@2
            displayName: 'Archive Terraform Files'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/terraform'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/terraform-files.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/terraform-files.zip'
            displayName: 'Publish Terraform Files for Submission'
            artifact: terraform-source

          #--------------------------------------------#
          # Archive Postman files
          #--------------------------------------------#
          - task: ArchiveFiles@2
            displayName: 'Archive Postman Test Collections'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/postman'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/postman-tests.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/postman-tests.zip'
            displayName: 'Publish Postman Tests for Submission'
            artifact: postman-source

          #--------------------------------------------#
          # Selenium UI Tests
          #--------------------------------------------#
          - task: ArchiveFiles@2
            displayName: 'Archive Selenium UI Tests'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/selenium'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-uitests.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-uitests.zip'
            displayName: 'Publish Selenium UI Tests Package'
            artifact: drop-uitests

          #--------------------------------------------#
          # Archive Selenium Python files
          #--------------------------------------------#
          - task: ArchiveFiles@2
            displayName: 'Archive Selenium Python Source Files'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/selenium'
              includeRootFolder: true
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/selenium-python-files.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/selenium-python-files.zip'
            displayName: 'Publish Selenium Python Files for Submission'
            artifact: selenium-source

          #--------------------------------------------#
          # FakeRestAPI
          #--------------------------------------------#
          - task: ArchiveFiles@2
            displayName: 'Archive FakeRestAPI'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter/fakerestapi'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-fakerestapi.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-fakerestapi.zip'
            displayName: 'Publish FakeRestAPI Package'
            artifact: drop-fakerestapi

          #--------------------------------------------#
          # JMeter Performance Tests
          #--------------------------------------------#
          - task: ArchiveFiles@2
            displayName: 'Archive JMeter Performance Tests'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter/test-suite'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-perftests.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId)-perftests.zip'
            displayName: 'Publish JMeter Performance Tests Package'
            artifact: drop-perftests

  #--------------------------------------------#
  # DEPLOYMENT STAGE
  #--------------------------------------------#
  - stage: Deploy
    displayName: Deploy Stage
    dependsOn: Build
    jobs:
      - deployment: DeployFakeRestAPI
        displayName: Deploy | FakeRestAPI to Web App
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop-fakerestapi
                  displayName: 'Download FakeRestAPI Artifact'

                - task: AzureWebApp@1
                  displayName: 'Deploy FakeRestAPI to Azure Web App'
                  inputs:
                    azureSubscription: '$(azureServiceConnectionId)'
                    appName: '$(webAppName)'
                    appType: 'webApp'
                    package: '$(Pipeline.Workspace)/drop-fakerestapi/$(Build.BuildId)-fakerestapi.zip'
                    deploymentMethod: 'zipDeploy'

      - job: PostmanTests
        displayName: Postman | API Tests
        dependsOn: DeployFakeRestAPI
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '16.x'

          - script: |
              npm install -g newman
            displayName: 'Install Newman'

          - script: |
              set -e
              cd "$(System.DefaultWorkingDirectory)/automatedtesting/postman"
              sed -i 's/{{baseurl}}/{{baseUrl}}/g' TestSuite.Regression.json
              sed -i 's/{{baseurl}}/{{baseUrl}}/g' TestSuite.Data-Validation.json
            displayName: 'Normalize baseurl variable name (baseUrl)'

          - script: |
              set -e
              cd "$(System.DefaultWorkingDirectory)/automatedtesting/postman"
              HOST="udacity-app-3bb41105.azurewebsites.net"

              echo "=========================================="
              echo "Starting Regression Tests"
              echo "=========================================="

              newman run TestSuite.Regression.json \
                --env-var "baseUrl=https://$HOST" \
                --env-var "baseurl=https://$HOST" \
                --env-var "protocol=https" \
                --reporters cli,junit \
                --reporter-junit-export result-Regression.xml
            displayName: 'Run Regression Tests'

          - script: |
              set -e
              cd "$(System.DefaultWorkingDirectory)/automatedtesting/postman"
              HOST="udacity-app-3bb41105.azurewebsites.net"

              echo "=========================================="
              echo "Starting Data Validation Tests"
              echo "=========================================="
              
              newman run TestSuite.Data-Validation.json \
                --env-var "baseUrl=https://$HOST" \
                --env-var "baseurl=https://$HOST" \
                --env-var "protocol=https" \
                --reporters cli,junit \
                --reporter-junit-export result-DataValidation.xml
            displayName: 'Run Data Validation Tests'

          - task: PublishTestResults@2
            displayName: 'Publish Postman Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/result-*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)/automatedtesting/postman'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'Postman API Tests - Regression & Data Validation'
              publishRunAttachments: true

      - deployment: RunJMeterTests
        displayName: Test | JMeter Performance
        dependsOn: DeployFakeRestAPI
        pool:
          name: myAgentPool
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop-perftests
                  displayName: 'Download JMeter Test Suite'

                - task: Bash@3
                  displayName: 'Install Java + Apache JMeter'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -euo pipefail

                      sudo apt-get update -y
                      sudo apt-get install -y openjdk-17-jre-headless unzip tar wget python3

                      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
                      export PATH="$JAVA_HOME/bin:$PATH"
                      java -version

                      TOOLS_DIR="$(Pipeline.Workspace)/tools"
                      JMETER_VERSION="5.6.3"
                      JMETER_DIR="$TOOLS_DIR/apache-jmeter-$JMETER_VERSION"
                      JMETER_BIN="$JMETER_DIR/bin/jmeter"

                      mkdir -p "$TOOLS_DIR"
                      cd "$TOOLS_DIR"

                      if [[ ! -d "apache-jmeter-$JMETER_VERSION" ]]; then
                        wget -q "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz"
                        tar -xzf "apache-jmeter-$JMETER_VERSION.tgz"
                      fi

                      "$JMETER_BIN" -v

                - task: Bash@3
                  displayName: 'Run JMeter Stress Test Suite'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -euo pipefail

                      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
                      export PATH="$JAVA_HOME/bin:$PATH"

                      cd "$(Pipeline.Workspace)/drop-perftests"

                      JMETER="$(Pipeline.Workspace)/tools/apache-jmeter-5.6.3/bin/jmeter"

                      # Clean previous results
                      rm -rf extracted_perftests
                      mkdir -p extracted_perftests

                      ZIP_FILE="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
                      if [[ -z "${ZIP_FILE}" ]]; then
                        echo "No .zip found in $(pwd)"
                        ls -la
                        exit 1
                      fi
                      unzip -o "$ZIP_FILE" -d extracted_perftests

                      # Clean output directory
                      OUT_DIR="$(Build.ArtifactStagingDirectory)/jmeter/stress"
                      rm -rf "$OUT_DIR"
                      mkdir -p "$OUT_DIR"

                      APPSERVICE_HOST="$(webAppName).azurewebsites.net"
                      echo "Testing against: https://$APPSERVICE_HOST"


                      echo "=========================================="
                      echo "Starting JMeter Stress Test"
                      echo "=========================================="

                      "$JMETER" -n \
                        -t extracted_perftests/StressTestSuite.jmx \
                        -JAPPSERVICEURL="$APPSERVICE_HOST" \
                        -JTHREADS=10 \
                        -JDURATION=60 \
                        -l "$OUT_DIR/stress-test-results.jtl" \
                        -j "$OUT_DIR/stress-test.log" \
                        -e -o "$OUT_DIR/stress-test-report"

                      echo ""
                      echo "=========================================="
                      echo "JMeter Stress Test Results"
                      echo "=========================================="
                      
                      # Show "Starting standalone test" line (required by rubric)
                      echo "Test Start Time:"
                      grep "Starting standalone test @" "$OUT_DIR/stress-test.log" || echo "Starting line not found in log"
                      
                      echo ""
                      echo "Test Summary (all summary lines):"
                      # Show all summary lines (required by rubric)
                      grep "summary =" "$OUT_DIR/stress-test.log" || echo "No summary found"
                      
                      echo "=========================================="

                - task: Bash@3
                  displayName: 'Run JMeter Endurance Test Suite'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -euo pipefail

                      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
                      export PATH="$JAVA_HOME/bin:$PATH"

                      cd "$(Pipeline.Workspace)/drop-perftests"

                      JMETER="$(Pipeline.Workspace)/tools/apache-jmeter-5.6.3/bin/jmeter"

                      # Clean previous results
                      rm -rf extracted_perftests
                      mkdir -p extracted_perftests

                      ZIP_FILE="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
                      if [[ -z "${ZIP_FILE}" ]]; then
                        echo "No .zip found in $(pwd)"
                        ls -la
                        exit 1
                      fi
                      unzip -o "$ZIP_FILE" -d extracted_perftests

                      # Clean output directory
                      OUT_DIR="$(Build.ArtifactStagingDirectory)/jmeter/endurance"
                      rm -rf "$OUT_DIR"
                      mkdir -p "$OUT_DIR"

                      APPSERVICE_HOST="$(webAppName).azurewebsites.net"
                      echo "Testing against: https://$APPSERVICE_HOST"



                      echo "=========================================="
                      echo "Starting JMeter Endurance Test"
                      echo "=========================================="

                      "$JMETER" -n \
                        -t extracted_perftests/EnduranceTestSuite.jmx \
                        -JAPPSERVICEURL="$APPSERVICE_HOST" \
                        -JTHREADS=2 \
                        -JDURATION=120 \
                        -l "$OUT_DIR/endurance-test-results.jtl" \
                        -j "$OUT_DIR/endurance-test.log" \
                        -e -o "$OUT_DIR/endurance-test-report"

                      echo ""
                      echo "=========================================="
                      echo "JMeter Endurance Test Results"
                      echo "=========================================="
                      
                      # Show "Starting standalone test" line (required by rubric)
                      echo "Test Start Time:"
                      grep "Starting standalone test @" "$OUT_DIR/endurance-test.log" || echo "Starting line not found in log"
                      
                      echo ""
                      echo "Test Summary (all summary lines):"
                      # Show all summary lines (required by rubric)
                      grep "summary =" "$OUT_DIR/endurance-test.log" || echo "No summary found"
                      
                      echo "=========================================="

                - publish: $(Build.ArtifactStagingDirectory)
                  displayName: 'Publish JMeter Reports, Logs, and JTL Results'
                  artifact: jmeter-reports

      - deployment: RunSeleniumTests
        displayName: Test | Selenium UI on VM
        dependsOn:
          - DeployFakeRestAPI
          - RunJMeterTests
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop-uitests
                  displayName: 'Download Selenium Test Suite'

                - task: Bash@3
                  displayName: 'Setup Selenium Test Environment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -euo pipefail
                      
                      echo "Installing Python and dependencies..."
                      sudo apt-get update -y
                      sudo apt-get install -y python3-pip python3-venv unzip
                      
                      echo "Installing Chrome and ChromeDriver..."
                      sudo apt-get install -y chromium-browser chromium-chromedriver || true
                      sudo apt-get install -y chromium-driver chromium || true
                      
                      echo "Upgrading pip and installing Python packages..."
                      pip3 install --upgrade pip
                      pip3 install selenium pytest pytest-html
                      
                      echo "Environment setup complete"

                - task: Bash@3
                  displayName: 'Execute Selenium UI Test Suite'
                  inputs:
                    targetType: 'inline'
                    workingDirectory: $(Agent.HomeDirectory)
                    script: |
                      set -euo pipefail

                      APP_DIR="$HOME/app"
                      mkdir -p "$APP_DIR"

                      echo "Extracting Selenium test files..."
                      cp "$(Pipeline.Workspace)/drop-uitests/$(Build.BuildId)-uitests.zip" "$APP_DIR/"
                      cd "$APP_DIR"
                      unzip -o "$(Build.BuildId)-uitests.zip"

                      # Create log directory for Azure Monitor ingestion
                      sudo mkdir -p /var/log/selenium
                      sudo chown "$(id -u):$(id -g)" /var/log/selenium
                      sudo chmod 755 /var/log/selenium

                      LOG_VM="/var/log/selenium/selenium-test.log"

                      echo "=========================================="
                      echo "Starting Selenium UI Test Suite"
                      echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")"
                      echo "Test File: login.py"
                      echo "=========================================="
                      
                      # Run tests with timestamped output for Azure Log Analytics
                      python3 login.py 2>&1 | while IFS= read -r line; do
                        echo "[$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")] $line"
                      done | tee -a "$LOG_VM"
                      
                      echo "=========================================="
                      echo "Selenium Test Suite Completed"
                      echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")"
                      echo "=========================================="
                      
                      # Copy log to artifacts staging
                      mkdir -p "$(Build.ArtifactStagingDirectory)"
                      cp "$LOG_VM" "$(Build.ArtifactStagingDirectory)/selenium-test.log"

                      # Ensure UTF-8 encoding (Azure Log Analytics requirement)
                      if command -v iconv >/dev/null 2>&1; then
                        iconv -f UTF-8 -t UTF-8 "$(Build.ArtifactStagingDirectory)/selenium-test.log" \
                          -o "$(Build.ArtifactStagingDirectory)/selenium-test.log.utf8" || true
                        if [[ -s "$(Build.ArtifactStagingDirectory)/selenium-test.log.utf8" ]]; then
                          mv "$(Build.ArtifactStagingDirectory)/selenium-test.log.utf8" \
                             "$(Build.ArtifactStagingDirectory)/selenium-test.log"
                        fi
                      fi
                      
                      echo "Log file prepared for publishing and Azure Monitor ingestion"

                - publish: $(Build.ArtifactStagingDirectory)/selenium-test.log
                  displayName: 'Publish Selenium Logs'
                  artifact: selenium-logs
                  condition: always()